name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Ensure FFmpeg is available for conversion tests
        shell: uv run python {0}
        run: |
          import os
          from pathlib import Path
          from gingertea.engine.deps import find_ffmpeg

          tool = find_ffmpeg(fetch=True)
          assert tool is not None, "FFmpeg and ffprobe are required for conversion tests"
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as path:
              path.write(tool.path + "\n")
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: uv run pytest -q -ra
      - run: uv build --no-sources

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GINGERTEA_SOURCE: ${{ github.workspace }}
      GINGERTEA_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install from this checkout with install.sh
        if: runner.os != 'Windows'
        run: sh install.sh
      - name: Check the installed command on Unix
        if: runner.os != 'Windows'
        run: '"$(uv tool dir --bin)/gingertea" --version'
      - name: Install from this checkout with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: Check the installed command on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& (Join-Path (uv tool dir --bin) "gingertea.exe") --version'
