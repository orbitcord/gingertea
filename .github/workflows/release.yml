name: Rust release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: gingertea-linux-x86_64
          - os: macos-latest
            asset: gingertea-macos-arm64
          - os: windows-latest
            asset: gingertea-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo build --release --locked
      - name: Package executable
        shell: bash
        run: |
          if [ -f target/release/gingertea.exe ]; then
            cp target/release/gingertea.exe '${{ matrix.asset }}'
          else
            cp target/release/gingertea '${{ matrix.asset }}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --generate-notes
