[package]
name = "gingertea"
version = "0.3.0"
edition = "2024"
description = "Download and convert media in your terminal"
license = "MIT"

[[bin]]
name = "gingertea"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
tempfile = "3"
ctrlc = "3"
libc = "0.2"
shell-words = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
