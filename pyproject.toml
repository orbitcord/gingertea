[project]
name = "gingertea"
version = "0.3.0"
description = "Download and convert videos from YouTube and 1,300+ other sites in your terminal. Runs on yt-dlp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "OrbitCord", email = "orbitcord@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["youtube", "yt-dlp", "downloader", "tui", "terminal", "converter", "mp3"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp[default]>=2026.8.19",
    "deno>=2.0",
]

[project.urls]
Homepage = "https://github.com/orbitcord/gingertea"
Issues = "https://github.com/orbitcord/gingertea/issues"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
include = [{ path = "rust/**", format = "sdist" }]
